<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Conversas | Opala Verde</title><style>body{font:16px Arial;background:#f3f7f1;color:#173c25;margin:0}main{max-width:1000px;margin:30px auto;padding:18px}header,.layout,.compose{display:flex;gap:15px}header{justify-content:space-between;align-items:center}.layout{align-items:stretch}aside{width:32%;background:white;padding:15px;border-radius:12px}section{flex:1;background:white;padding:15px;border-radius:12px}button{background:#287b44;color:white;border:0;padding:12px;border-radius:8px;cursor:pointer}input,textarea{padding:10px;border:1px solid #bbb;border-radius:8px;box-sizing:border-box}textarea{flex:1}#messages{height:380px;overflow:auto;border:1px solid #ddd;padding:12px;margin:12px 0;white-space:pre-wrap}.entry{display:block;width:100%;margin:8px 0;text-align:left;background:#e5f0e7;color:#173c25}.bubble{margin:8px 0;padding:10px;background:#eaf3eb;border-radius:8px}.mine{background:#c8e6cf;text-align:right}@media(max-width:650px){.layout{flex-direction:column}aside{width:auto}}</style></head><body><main><header><h1>Minhas conversas</h1><a id="backLink" href="login.html">Voltar ao painel</a></header><p id="error" role="alert"></p><div class="layout"><aside><h3>Conversas</h3><div id="list"></div></aside><section><h3 id="title">Selecione uma conversa</h3><div id="messages"></div><div class="compose"><textarea id="content" rows="2" placeholder="Digite sua mensagem"></textarea><button id="send">Enviar</button></div></section></div></main><script src="api.js"></script><script>
let active=Number(sessionStorage.getItem('opalaverde_active_conversation'))||null, me=getCurrentUserData(); const qs=new URLSearchParams(location.search); const error=document.getElementById('error');
async function load(){try{const data=await apiFetchJSON('/orders/conversations/');const arr=Array.isArray(data)?data:data.results||[];const list=document.getElementById('list');list.replaceChildren();if(!arr.length){const p=document.createElement('p');p.textContent='Nenhuma conversa ainda.';list.append(p)}arr.forEach(c=>{const b=document.createElement('button');b.className='entry';b.textContent=(c.customer===me?.id?c.recipient_name:c.customer_name)||'Conversa '+c.id;b.onclick=()=>select(c);list.append(b)});if(active){const found=arr.find(c=>c.id===active);if(found)select(found)}else if(arr.length)select(arr[0]);}catch(e){error.textContent='Não foi possível carregar as conversas. Verifique seu login e conexão.'}}
function select(c){active=c.id;sessionStorage.setItem('opalaverde_active_conversation',String(active));document.getElementById('title').textContent=(c.customer===me?.id?c.recipient_name:c.customer_name)||'Conversa';const m=document.getElementById('messages');m.replaceChildren();c.messages.forEach(msg=>{const d=document.createElement('div');d.className='bubble'+(msg.sender===me?.id?' mine':'');d.textContent=msg.content;m.append(d)});m.scrollTop=m.scrollHeight}
document.getElementById('send').onclick=async()=>{const el=document.getElementById('content');if(!active||!el.value.trim())return;try{await apiFetchJSON('/orders/conversations/'+active+'/send/',{method:'POST',body:JSON.stringify({content:el.value.trim()})});el.value='';await load()}catch(e){error.textContent='Falha ao enviar mensagem.'}};
(async()=>{document.getElementById('backLink').href=me?.user_type==='produtor'?'painel_inicial_produtor.html':me?.user_type==='admin'?'inicial-admin.html':'inicial_cliente.html';if(!TokenManager.getAccess()){location.href='login.html';return}if(qs.has('recipient')){try{const payload={recipient:Number(qs.get('recipient'))};if(qs.has('order'))payload.order=Number(qs.get('order'));const c=await apiFetchJSON('/orders/conversations/start/',{method:'POST',body:JSON.stringify(payload)});active=c.id}catch(e){error.textContent=e.data?.detail||'Não foi possível iniciar a conversa.'}}await load()})();setInterval(()=>{if(document.visibilityState==='visible' && !document.getElementById('content').value.trim())load()},6000);
</script><script src="site-config-public.js?v=1"></script>
</body></html>
