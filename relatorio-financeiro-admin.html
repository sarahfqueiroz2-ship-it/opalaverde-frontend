<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatório financeiro | Opala Verde</title><style> :root{font-family:Inter,Arial,sans-serif;color:#193529;background:#f5f8f5}*{box-sizing:border-box}body{margin:0}header{background:#175b3c;color:white;padding:20px 5%;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}header h1{margin:0;font-size:24px}nav{background:white;padding:12px 5%;display:flex;gap:8px;flex-wrap:wrap;box-shadow:0 2px 8px #0001}nav a{padding:9px 12px;border-radius:8px;text-decoration:none;color:#175b3c;font-weight:600}nav a.active,nav a:hover{background:#e0f2e7}main{max-width:1180px;margin:32px auto;padding:0 20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px}.card,.panel{background:white;border:1px solid #dce8df;border-radius:14px;padding:20px;box-shadow:0 2px 8px #00000008}.card span{display:block;color:#53665a;font-size:14px}.card strong{display:block;font-size:27px;margin-top:10px;color:#175b3c}.panel{margin-top:24px;overflow:auto}h2{font-size:23px}h3{margin-top:0}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:12px;border-bottom:1px solid #e6ede8;font-size:14px}th{color:#496354}button{border:0;border-radius:8px;background:#175b3c;color:white;padding:11px 15px;cursor:pointer}button:hover{background:#10432b}.muted{color:#65766c}#error{color:#9c2525;font-weight:600}input{padding:11px;border:1px solid #ccd8ce;border-radius:8px;width:100%;max-width:360px;margin-bottom:14px} .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}</style></head><body data-page="finance"><header><h1>OpalaVerde · Administração</h1><button onclick="logout()">Sair</button></header><nav><a class="" href="inicial-admin.html">Visão geral</a><a class="" href="gerenciar-usuarios-admin.html">Usuários</a><a class="" href="gerenciar-pedidos-admin.html">Pedidos</a><a class="" href="gestao-categoria-admin.html">Categorias</a><a class="active" href="relatorio-financeiro-admin.html">Financeiro</a><a class="" href="sistema-de-comunicacao-admin.html">Conversas</a><a class="" href="configuracoes-do-site-admin.html">Configurações</a></nav><main><div class="top"><h2>Relatório financeiro</h2><button onclick="loadAdmin()">Atualizar dados</button></div><p id="error" role="alert"></p><div id="content"><p class="muted">Carregando informações do banco de dados...</p></div></main><script src="api.js"></script><script>
const currentUser = requireAuth(['admin']);
const money = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data = null;
async function loadAdmin(){try{data=await apiFetchJSON('/accounts/admin-overview/'); render();document.getElementById('error').textContent='';}catch(e){document.getElementById('error').textContent='Não foi possível carregar os dados reais. Verifique se o backend atualizado está rodando e se você entrou como administrador. ('+(e.data?.detail||e.status||'sem conexão')+')';}}
function table(rows,cols){return '<table><thead><tr>'+cols.map(c=>'<th>'+esc(c[0])+'</th>').join('')+'</tr></thead><tbody>'+ (rows.length?rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(c[1](r))+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+cols.length+'">Nenhum registro encontrado.</td></tr>')+'</tbody></table>';}
function card(label,value){return '<div class="card"><span>'+esc(label)+'</span><strong>'+esc(value)+'</strong></div>';}
function render(){const target=document.getElementById('content');if(!data)return;const page=document.body.dataset.page;
if(page==='home'){target.innerHTML='<div class="cards">'+card('Usuários cadastrados',data.users)+card('Clientes',data.clients)+card('Produtores',data.producers)+card('Produtos ativos',data.active_products)+card('Pedidos',data.orders)+card('Pedidos em andamento',data.pending_orders)+card('Pagamentos confirmados',data.paid_orders)+card('Total de pedidos pagos',money(data.revenue_confirmed))+'</div><section class="panel"><h3>Últimos pedidos</h3>'+ordersTable(data.orders_list.slice(0,10))+'</section>';}
if(page==='users'){target.innerHTML='<section class="panel"><h3>Usuários cadastrados ('+data.users+')</h3><input id="search" placeholder="Pesquisar por nome ou e-mail" oninput="filterUsers()"><div id="results"></div><p class="muted">Exibindo até 500 usuários. A consulta é somente leitura.</p></section>';filterUsers();}
if(page==='orders'){target.innerHTML='<div class="cards">'+card('Total de pedidos',data.orders)+card('Em andamento',data.pending_orders)+card('Pagos',data.paid_orders)+'</div><section class="panel"><h3>Pedidos</h3><div id="results">'+ordersTable(data.orders_list)+'</div><p class="muted">Exibindo até 500 pedidos. Para alterar estados, utilize os fluxos de pedidos existentes.</p></section>';}
if(page==='finance'){target.innerHTML='<div class="cards">'+card('Receita de pedidos com pagamento confirmado',money(data.revenue_confirmed))+card('Pedidos pagos',data.paid_orders)+card('Total de pedidos',data.orders)+'</div><section class="panel"><h3>Pedidos e pagamentos</h3>'+ordersTable(data.orders_list)+'</section><p class="muted">O valor é a soma dos totais de pedidos com pagamento confirmado, excluindo cancelados. Inclui eventuais taxas de entrega. Não representa lucro, comissões nem valores efetivamente repassados.</p>';}
}
function ordersTable(rows){return table(rows,[['Pedido',r=>'#'+r.id],['Cliente',r=>r.customer__username],['Status',r=>r.status],['Pagamento',r=>r.payment_status],['Total',r=>money(r.total)],['Data',r=>new Date(r.created_at).toLocaleDateString('pt-BR')]]);}
function filterUsers(){const q=document.getElementById('search').value.toLowerCase();const rows=data.users_list.filter(u=>(u.username+' '+u.email+' '+u.first_name+' '+u.last_name).toLowerCase().includes(q));document.getElementById('results').innerHTML=table(rows,[['ID',u=>u.id],['Nome',u=>(u.first_name+' '+u.last_name).trim()||u.username],['E-mail',u=>u.email],['Tipo',u=>u.user_type],['Ativo',u=>u.is_active?'Sim':'Não']]);}
function logout(){apiLogout();location.href='login.html';}
if(currentUser)loadAdmin();
</script></body></html>
